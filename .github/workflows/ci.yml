name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black mypy
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check code formatting with black
      run: |
        black --check src tests
    
    - name: Type check with mypy
      run: |
        mypy src --ignore-missing-imports --no-strict-optional
      continue-on-error: true
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      run: |
        docker build -t eks-upgrade-planner:test .
    
    # --help passes even when the bundled data is missing, so exercise a
    # command that actually has to read it.
    - name: Test Docker image
      run: |
        docker run --rm eks-upgrade-planner:test --help
        docker run --rm eks-upgrade-planner:test version
        docker run --rm eks-upgrade-planner:test check-addon \
          --addon coredns --current v1.11.1-eksbuild.1 --eks-version 1.30 \
          | tee /tmp/docker-out.txt
        if grep -qi "not compatible" /tmp/docker-out.txt; then
          echo "::error::docker image cannot read its bundled data"
          exit 1
        fi

  package:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
    
    # The wheel must carry the YAML data files. Without this the package
    # installs cleanly and then reports every EKS version as unsupported.
    - name: Verify data files are in the wheel
      run: |
        python - <<'PY'
        import glob, sys, zipfile
        wheel = glob.glob("dist/*.whl")[0]
        names = zipfile.ZipFile(wheel).namelist()
        required = [
            "src/data/compatibility_matrix.yaml",
            "src/data/addon_versions.yaml",
            "src/config/config.yaml",
        ]
        missing = [r for r in required if r not in names]
        if missing:
            print("MISSING from wheel:", missing)
            print("wheel contains:", sorted(names))
            sys.exit(1)
        print("all data files present in", wheel)
        PY
    
    # Install the built wheel somewhere with no repository around it and drive
    # the real CLI. This is what catches a broken data path end to end.
    - name: Smoke-test the installed package
      run: |
        python -m venv /tmp/venv
        /tmp/venv/bin/pip install --quiet dist/*.whl
        mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
        /tmp/venv/bin/eks-upgrade-planner version
        /tmp/venv/bin/eks-upgrade-planner check-addon \
          --addon coredns --current v1.11.1-eksbuild.1 --eks-version 1.30 \
          | tee /tmp/out.txt
        if grep -qi "not compatible" /tmp/out.txt; then
          echo "::error::installed package cannot read its bundled data"
          exit 1
        fi
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
